name: "CodeQL"

# GitHub disabled this workflow for inactivity (last run 2026-03-27). After
# this change lands, a maintainer must re-enable it once in the Actions tab
# (Actions > CodeQL > "Enable workflow"); workflow_dispatch then allows a
# manual first run.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '45 23 * * 5'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The conversion engine is Rust (rust/); Python is the thin binder
          # plus the tests. Neither needs a build for CodeQL to extract it.
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
