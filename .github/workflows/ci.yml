name: CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # For setuptools_scm
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions coveralls
        pip install -r tests/requirements-test.txt
        pip install -e .
    - name: Test with tox
      run: |
        tox -v || (echo "Tox failed. Here's the log:" && cat .tox/*/log/*.log 2>/dev/null && exit 1)
    - name: Run E2E sentence tests
      run: |
        python tests/test_e2e_with_sentence_function.py
    - name: Build package
      if: matrix.python-version == '3.11'
      run: |
        pip install build
        python -m build
        ls -la dist/
    - name: Upload build artifacts
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Upload coverage data to coveralls.io
      run: coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
        COVERALLS_PARALLEL: true
      continue-on-error: true

  # PyPI ships the SLIM build (--no-default-features: no lingua-rs models,
  # num2words_sentence(lang=None) disabled). `pip install -e .` above builds
  # the default (full) feature set, so test the slim one separately.
  test-slim:
    name: Test slim build (as shipped on PyPI)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build the slim extension in place
      env:
        # Passed by maturin's PEP 517 backend to `maturin build`.
        MATURIN_PEP517_ARGS: --no-default-features
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Check that the build is slim
      run: |
        python - <<'PY'
        from num2words2 import num2words_sentence
        try:
            num2words_sentence("I have 5 apples", lang=None)
        except NotImplementedError as e:
            assert "without lang-detect" in str(e), e
        else:
            raise SystemExit("expected a slim build without lang-detect")
        PY
    - name: Run the test suite
      run: python -m pytest -q tests/

  coveralls:
    name: Indicate completion to coveralls.io
    needs: build
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-distribution:
    name: Build Distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # For setuptools_scm
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build distribution
      run: |
        python -m build
        ls -la dist/
    - name: Check distribution
      run: |
        twine check dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution-artifacts
        path: dist/

  test-built-package:
    name: Test Built Package
    needs: build-distribution
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: distribution-artifacts
        path: dist/
    - name: Test installation
      run: |
        pip install dist/*.whl
        python -c "import num2words2; print('Version:', getattr(num2words2, '__version__', 'not set'))"
        python -c "import importlib.metadata as m, num2words2; assert num2words2.__version__ == m.version('num2words2'), (num2words2.__version__, m.version('num2words2'))"
        python -c "from num2words2 import num2words; print('English 42:', num2words(42, lang='en'))"
        python -c "from num2words2 import num2words; print('Assamese 42:', num2words(42, lang='as'))"
