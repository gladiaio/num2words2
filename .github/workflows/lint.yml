name: Lint

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Same versions as .pre-commit-config.yaml, so the hooks and CI agree.
        pip install flake8 "isort==5.13.2" "black==23.12.1" mypy

    - name: Check code formatting with Black
      run: |
        black --check --diff num2words2 tests

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 num2words2 tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 num2words2 tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff num2words2 tests

    # Informational only: the package is a thin binder over the compiled
    # num2words2._rust extension, which ships no type stubs yet (see #244),
    # so mypy cannot check the calls that matter.
    - name: Type checking with mypy
      run: |
        mypy num2words2 --ignore-missing-imports
      continue-on-error: true
