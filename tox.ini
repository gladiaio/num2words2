[tox]
envlist = py310,py311,py312,py313,py314,py315,flake8,isort

[gh-actions]
python =
    3.10: py310, flake8, isort
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315


[testenv]
passenv = GITHUB_*
deps =
    coverage
    delegator.py
    pytest
    langdetect
commands =
    # pytest, NOT `unittest discover`: unittest only collects TestCase
    # subclasses, so every module-level `def test_*` function in tests/ was
    # silently skipped — 52 of them across 23 files, five of which were
    # failing. See the PR that introduced this line.
    coverage run -m pytest tests/
    coverage report --fail-under=75 --omit=.tox/*,tests/*,/usr/*,num2words2/lang_AS.py,num2words2/lang_BA.py,num2words2/lang_BO.py,num2words2/lang_BR.py,num2words2/lang_BS.py,num2words2/lang_EU.py,num2words2/lang_FO.py,num2words2/lang_GL.py,num2words2/lang_GU.py,num2words2/lang_HAW.py,num2words2/lang_HT.py,num2words2/lang_JW.py,num2words2/lang_KA.py,num2words2/lang_KK.py,num2words2/lang_KM.py,num2words2/lang_LA.py,num2words2/lang_LB.py,num2words2/lang_LN.py,num2words2/lang_LO.py,num2words2/lang_MG.py,num2words2/lang_MI.py,num2words2/lang_MK.py,num2words2/lang_ML.py,num2words2/lang_MR.py,num2words2/lang_MT.py,num2words2/lang_MY.py,num2words2/lang_NE.py,num2words2/lang_NN.py,num2words2/lang_OC.py,num2words2/lang_PA.py,num2words2/lang_PS.py,num2words2/lang_SA.py,num2words2/lang_SD.py,num2words2/lang_SI.py,num2words2/lang_SO.py,num2words2/lang_SU.py,num2words2/lang_TK.py,num2words2/lang_TL.py,num2words2/lang_TT.py,num2words2/lang_UR.py,num2words2/lang_UZ.py,num2words2/lang_WO.py,num2words2/lang_YI.py,num2words2/lang_YO.py,num2words2/_version.py
    coverage report --fail-under=98 --include=tests/* --skip-covered --omit=tests/test_all_python_versions.py,tests/test_local.sh,tests/test_fractional_cents.py,tests/test_currency_comprehensive.py,tests/test_comprehensive_converter.py,tests/test_e2e_with_sentence_function.py,tests/test_sentence_function.py,tests/test_e2e_sentences.py,tests/basetest.py

[testenv:flake8]
changedir = {toxinidir}
deps =
    flake8==5.0.4
    flake8-copyright
commands =
    flake8 --exclude=num2words2/_version.py --extend-ignore=E501,E203 --per-file-ignores=tests/*:E501,W293,W292,E231,E241,E303,W391,E226,E202,E201,E221,E222,E702,F401 num2words2 tests setup.py

[testenv:isort]
changedir = {toxinidir}
deps =
    isort
    delegator.py
commands =
    isort --check-only --float-to-top --diff --skip num2words2/_version.py --skip num2words2/__init__.py num2words2 tests
